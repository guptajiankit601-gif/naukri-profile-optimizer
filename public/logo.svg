      <stop offset="0%" stop-color="#355C7D" />
      <stop offset="45%" stop-color="#725A7A" />
      <stop offset="100%" stop-color="#FF7582" />
    </linearGradient>
    <filter id="glyphGlow" x="-10" y="-10" width="84" height="84" filterUnits="userSpaceOnUse">
